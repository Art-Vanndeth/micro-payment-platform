spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  config:
    import: "configserver:"
  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://127.0.0.1:8889}
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]': # Apply to all routes
                allowedOrigins:
                  - "http://localhost:3000" # Frontend URL
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "OPTIONS"
                allowedHeaders:
                  - "Content-Type"
                  - "Authorization"
                allowCredentials: true