spring:
  application:
    name: payment-service

  # Jackson Configuration for LocalDateTime
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # R2DBC Configuration for reactive operations
  r2dbc:
    url: r2dbc:postgresql://127.0.0.1:5432/payment_platform
    username: payment_user
    password: payment_password
    pool:
      initial-size: 10
      max-size: 20

  # JDBC DataSource Configuration for Flyway migrations
#  datasource:
#    url: jdbc:postgresql://127.0.0.1:5432/payment_platform
#    username: payment_user
#    password: payment_password
#    driver-class-name: org.postgresql.Driver

  # Flyway Configuration - ENABLED for table creation and data insertion
#  flyway:
#    enabled: true
#    locations: classpath:db/migration
#    baseline-on-migrate: true
#    baseline-version: 0
#    url: jdbc:postgresql://127.0.0.1:5432/payment_platform
#    user: payment_user
#    password: payment_password

  # Redis Configuration for caching
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis_password
      timeout: 2000ms
      database: 1  # Use different database from account service

  # Kafka Configuration - ENABLED for event publishing
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      enable-idempotence: true

# Account Service Integration Configuration
account-service:
  url: http://localhost:8090/api/accounts/

# Logging Configuration
logging:
  level:
    com.pipay.payment: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.r2dbc: DEBUG
    org.flywaydb: INFO

# Server Configuration
server:
  port: 8091

# Management and Health Check Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
