server:
  port: 8092

spring:
  application:
    name: transaction-service

  data:
    mongodb:
      uri: mongodb://mongo_user:mongo_password@localhost:27017/payment_audit?authSource=admin

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topics:
    payment-created-events: payment-created-events
    transaction-events: transaction-event-topics
  consumer:
    group-id: transaction-service-group

logging:
  level:
    com.pipay.transaction: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

